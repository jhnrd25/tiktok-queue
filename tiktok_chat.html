<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DM Queue</title>
<style>
:root{--bg:#f3f6f7;--surface:#fff;--ink:#16212b;--muted:#5d6b78;--line:#d9e1e6;--accent:#0b7f8f;--accent-ink:#fff;--ok:#1f8a4c;--skip:#a06a00;--chip:#e8eef1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--surface:#18222b;--ink:#e8eef2;--muted:#93a3b0;--line:#2b3946;--accent:#3cc0d1;--accent-ink:#06222a;--ok:#5fd08a;--skip:#e0b04a;--chip:#223140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161c;--surface:#18222b;--ink:#e8eef2;--muted:#93a3b0;--line:#2b3946;--accent:#3cc0d1;--accent-ink:#06222a;--ok:#5fd08a;--skip:#e0b04a;--chip:#223140;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:4px 0 12px;letter-spacing:-.01em}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:9px;border-radius:9px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0 0}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:10px;resize:vertical}
button.btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);margin-top:10px}
button.btn.alt{background:var(--chip);color:var(--ink)}
button.btn.ok{background:var(--ok);color:#fff}
.row{display:flex;gap:8px}
.row .btn{margin-top:10px}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.who{font-size:1.5rem;font-weight:800;word-break:break-all;margin:0 0 4px}
.preview{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;margin:10px 0 0;font-size:.95rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list li:last-child{border:0}
.list li.cur .n{font-weight:800;color:var(--accent)}
.chip{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted)}
.chip.sent{color:var(--ok)}.chip.skipped{color:var(--skip)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
a.lnk{color:var(--accent);font-weight:600}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;padding:6px 0}
</style>
</head>
<body>
<main>
<h1>DM queue</h1>
<div class="tabs" role="tablist">
  <button id="tq" class="on" onclick="tab('q')">Queue</button>
  <button id="ts" onclick="tab('s')">Setup</button>
</div>

<section id="vq"></section>

<section id="vs" hidden>
  <div class="card">
    <label for="names">Add usernames</label>
    <textarea id="names" placeholder="one per line&#10;@creator_one&#10;https://www.tiktok.com/@creator_two"></textarea>
    <p class="hint">Accepts @names, plain names, or profile links. Commas work too. Duplicates are removed.</p>
    <button class="btn" onclick="addNames()">Add to queue</button>
  </div>
  <div class="card">
    <label for="tpl">Message template</label>
    <textarea id="tpl" oninput="saveTpl()"></textarea>
    <p class="hint">Use {username} where the name should go. Saved on this device.</p>
  </div>
  <div class="card">
    <button class="btn alt" style="margin-top:0" onclick="resetStatus()">Mark everyone as pending</button>
    <button class="btn alt" onclick="clearAll()">Clear the whole list</button>
  </div>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
var KEY="dmq1",S={users:[],tpl:"Hi {username}, I came across your profile and wanted to reach out. Do you have a minute to chat?",cur:0};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.users))S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},2200)}
function tab(t){$("vq").hidden=t!=="q";$("vs").hidden=t!=="s";$("tq").classList.toggle("on",t==="q");$("ts").classList.toggle("on",t==="s");if(t==="q")render()}
function msgFor(u){return S.tpl.replace(/\{username\}/gi,"@"+u.name)}
function url(u){return "https://www.tiktok.com/@"+encodeURIComponent(u.name)}

function addNames(){
  var parts=$("names").value.split(/[\n,;\s]+/),have={},added=0;
  S.users.forEach(function(u){have[u.name.toLowerCase()]=1});
  parts.forEach(function(p){
    p=p.trim();if(!p)return;
    var m=p.match(/tiktok\.com\/@([\w.]+)/i);
    p=(m?m[1]:p.replace(/^@/,"")).replace(/[?#].*$/,"");
    if(!/^[\w.]{1,40}$/.test(p)||have[p.toLowerCase()])return;
    have[p.toLowerCase()]=1;S.users.push({name:p,status:"pending"});added++;
  });
  $("names").value="";save();toast(added+" added");
  if(added){tab("q")}
}
function saveTpl(){S.tpl=$("tpl").value;save()}
function firstPending(from){
  for(var i=0;i<S.users.length;i++){var j=(from+i)%S.users.length;if(S.users[j].status==="pending")return j}
  return -1;
}
function copy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text)}
  return Promise.reject();
}
function fallbackCopy(text){
  var t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";
  document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,t.value.length);var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(t);return ok;
}
function copyNow(text){
  var ok=fallbackCopy(text);
  if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){
    try{navigator.clipboard.writeText(text).catch(function(){});ok=true}catch(e){}
  }
  return ok;
}
function copyOnly(){
  var u=S.users[S.cur];if(!u)return;
  toast(copyNow(msgFor(u))?"Message copied":"Copy failed. Select the text and copy it.");
}
function openChat(){
  var u=S.users[S.cur];if(!u)return;
  var ok=copyNow(msgFor(u));
  var w=window.open(url(u),"_blank");
  toast(w?(ok?"Message copied. Paste it in the chat.":"Opened. Use Copy message, then paste."):"Popup blocked. Tap Open profile above.");
}
function mark(st){
  var u=S.users[S.cur];if(!u)return;
  u.status=st;var n=firstPending(S.cur+1);if(n>=0)S.cur=n;save();render();
}
function pick(i){S.cur=i;save();render();window.scrollTo(0,0)}
function resetStatus(){S.users.forEach(function(u){u.status="pending"});S.cur=0;save();toast("All set to pending")}
function clearAll(){if(confirm("Remove every username from the list?")){S.users=[];S.cur=0;save();render();toast("List cleared")}}

function render(){
  var q=$("vq"),us=S.users;
  if(!us.length){q.innerHTML='<div class="card empty">Your queue is empty.<br>Open <b>Setup</b> to paste your usernames.</div>';return}
  if(S.cur>=us.length)S.cur=0;
  var sent=us.filter(function(u){return u.status==="sent"}).length;
  var left=us.filter(function(u){return u.status==="pending"}).length;
  var h='<div><strong>'+sent+' of '+us.length+' sent</strong><span style="color:var(--muted)"> · '+left+' left</span></div>';
  h+='<div class="bar"><i style="width:'+Math.round(sent/us.length*100)+'%"></i></div>';
  var u=us[S.cur];
  if(!left&&u.status!=="pending"){h+='<div class="card empty"><b>Queue finished.</b><br>Tap any name below to revisit it.</div>'}
  h+='<div class="card"><p class="who">@'+esc(u.name)+'</p>';
  h+='<a class="lnk" href="'+url(u)+'" target="_blank" rel="noopener">Open profile</a>';
  h+='<div class="preview">'+esc(msgFor(u))+'</div>';
  h+='<button class="btn" onclick="openChat()">Copy message and open profile</button>';
  h+='<button class="btn alt" onclick="copyOnly()">Copy message only</button>';
  h+='<div class="row"><button class="btn ok" onclick="mark(\'sent\')">Sent, next</button><button class="btn alt" onclick="mark(\'skipped\')">Skip</button></div></div>';
  h+='<div class="card"><ul class="list">';
  us.forEach(function(x,i){
    h+='<li class="'+(i===S.cur?"cur":"")+'" onclick="pick('+i+')"><span class="n">@'+esc(x.name)+'</span><span class="chip '+x.status+'">'+x.status+'</span></li>';
  });
  h+='</ul></div>';
  q.innerHTML=h;
}
$("tpl").value=S.tpl;
if(!S.users.length)tab("s");else render();
</script>
</body>
</html>
